<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ziegen-Buddy</title>
<script>
(function () {
  try {
    var d = document.documentElement, p = {};
    function add(s) {
      s.replace(/^[?#]/, '').split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('=');
        var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i)).toLowerCase();
        var v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
        if (i < 0 && /^(simpel|simple|einfach|iframe|embed)$/.test(k)) p.modus = k; else p[k] = v;
      });
    }
    add(location.search);
    add(location.hash);
    if (/^(simpel|simple|einfach|iframe|embed)$/i.test(p.modus || p.mode || '')) {
      d.classList.add('simple');
      var s = String(p.schema || '').toLowerCase();
      if (s) d.setAttribute('data-schema', /^(dunkel|dark)$/.test(s) ? 'dunkel' : 'hell');
    }
  } catch (e) { /* ignore */ }
})();
</script>
<!--
  Ziegen-Buddy

  Simpel-Modus fürs iframe (nur die Ziege, durchsichtiger Hintergrund):
  <iframe src="ziegen-buddy.html?modus=simpel&groesse=3&hut=krone"
          title="Ziegen-Buddy" style="width:100%;height:150px;border:0" loading="lazy"></iframe>

  Parameter (Standard in Klammern, ja/nein-Werte gehen auch als 1/0 oder an/aus):
    modus=simpel      nur die Ziege, ohne Chat und Knöpfe
    name=Hörnli       Name der Ziege (zufällig)
    hut=krone         keiner, krone, zylinder, propeller, heiligenschein, zauberhut, muetze, entli, edelweiss (keiner)
    groesse=3         Pixelgrösse 1 bis 8 oder s, m, l (3)
    streicheln=ja     Klick auf die Ziege zeigt Herzen
    fuettern=ja       Klick auf den Boden lässt Gras wachsen
    hochheben=ja      Ziege packen, hochziehen und werfen
    sprechblasen=ja   Sprechblasen anzeigen
    plappern=ja       redet ab und zu von selbst
    laufen=ja         läuft herum (nein: bleibt an ihrem Platz)
    schlafen=ja       legt sich hin und schläft, wenn sie müde ist
    beduerfnisse=ja   wird hungrig und müde
    gras=ja           Gras und Blumen wachsen von selbst
    boden=nein        Graslinie und Erde (im normalen Modus ja)
    berge=nein        Berge im Hintergrund (im normalen Modus ja)
    felsen=nein       Felsen zum Klettern (im normalen Modus ja)
    ei=nein           schlüpft beim ersten Besuch aus einem Ei (im normalen Modus ja)
    ton=nein          Geräusche, sobald jemand in den Rahmen geklickt hat
    speichern=ja      merkt sich Name, Hunger und Hut im Browser
    tempo=1           Laufgeschwindigkeit, 0.25 bis 3
    start=mitte       links, mitte, rechts oder 0 bis 100
    farben=hell       hell oder dunkel: Farben von Bergen, Boden und Sprechblase (auto folgt dem System)
    blase=            nur die Sprechblase: hell oder dunkel
    hintergrund=      Farbe statt durchsichtig, z. B. ffffff
    schema=           dunkel, falls deine Seite color-scheme: dark setzt
-->
<style>
:root {
  color-scheme: light;
  --page: #fbfbf8;
  --panel: #f2f3ee;
  --ink: #1f231f;
  --ink-2: #454b44;
  --muted: #6c7269;
  --faint: #9ca198;
  --line: #dfe2d9;
  --line-2: #c9cdc2;
  --accent: #c33a2c;
  --gold: #9a6b10;
  --good: #58994a;
  --warn: #c88a14;
  --bad: #c33a2c;
  --sel: #f4e6e2;
  --bubble: #ffffff;
  --bubble-ink: #1f231f;
  --bubble-line: #cdd1c6;
  --shadow: 0 16px 36px -22px rgba(20, 40, 20, .4);
  --icon-heart: #d8434f;
  --icon-grass: #4f9a4a;
  --icon-gold: #b8862b;
  --icon-moon: #5b72b8;
  --mtn1: #eceee7;
  --mtn2: #e3e7de;
  --snow: #ffffff;
  --gpx: #8cc56f;
  --gpx2: #6aa954;
  --soil: #ddd6c6;
  --soil2: #cdc4b1;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --font-pixel: "Pixelify Sans", "DM Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #151917;
    --panel: #1b201d;
    --ink: #e6e9e2;
    --ink-2: #c4c9c0;
    --muted: #979e94;
    --faint: #656c63;
    --line: #262c28;
    --line-2: #343b36;
    --accent: #f06b56;
    --gold: #f2c14e;
    --good: #7cc262;
    --warn: #e6a93a;
    --bad: #f06b56;
    --sel: #2c201d;
    --bubble: #1f2522;
    --bubble-ink: #e6e9e2;
    --bubble-line: #3a423c;
    --shadow: 0 16px 40px -18px rgba(0, 0, 0, .7);
    --icon-heart: #f0707a;
    --icon-grass: #7cc262;
    --icon-gold: #f2c14e;
    --icon-moon: #9fb4e8;
    --mtn1: #1b201d;
    --mtn2: #1f2622;
    --snow: #2c3430;
    --gpx: #4f8f45;
    --gpx2: #3c7336;
    --soil: #221f1a;
    --soil2: #1a1814;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #151917;
  --panel: #1b201d;
  --ink: #e6e9e2;
  --ink-2: #c4c9c0;
  --muted: #979e94;
  --faint: #656c63;
  --line: #262c28;
  --line-2: #343b36;
  --accent: #f06b56;
  --gold: #f2c14e;
  --good: #7cc262;
  --warn: #e6a93a;
  --bad: #f06b56;
  --sel: #2c201d;
  --bubble: #1f2522;
  --bubble-ink: #e6e9e2;
  --bubble-line: #3a423c;
  --shadow: 0 16px 40px -18px rgba(0, 0, 0, .7);
  --icon-heart: #f0707a;
  --icon-grass: #7cc262;
  --icon-gold: #f2c14e;
  --icon-moon: #9fb4e8;
  --mtn1: #1b201d;
  --mtn2: #1f2622;
  --snow: #2c3430;
  --gpx: #4f8f45;
  --gpx2: #3c7336;
  --soil: #221f1a;
  --soil2: #1a1814;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 700px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 36px;
  display: grid;
  gap: 16px;
}
.sr {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
.pet { display: grid; min-width: 0; }

/* ---------- scene */
.screen { position: relative; overflow: hidden; }
.screen.shake { animation: shake .34s steps(2, end) 1; }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-3px, 1px); }
  50% { transform: translate(3px, -1px); }
  75% { transform: translate(-2px, 0); }
}
.log {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 190px;
  overflow-y: auto;
  padding: 0 2px 6px;
  line-height: 1.55;
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) transparent;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
  mask-image: linear-gradient(to bottom, transparent 0, #000 26px);
}
.log::before { content: ""; margin-top: auto; }
.meadow {
  position: relative;
  height: var(--meadow-h, 138px);
  touch-action: pan-y;
  cursor: copy;
  -webkit-user-select: none;
  user-select: none;
}
.meadow.nofeed { cursor: default; }
.handle {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
  touch-action: none;
  cursor: grab;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.handle.pet-only { cursor: pointer; }
.handle.dragging { cursor: grabbing; }
#world {
  position: absolute;
  left: 0;
  bottom: 0;
  pointer-events: none;
  image-rendering: pixelated;
  z-index: 2;
}
.bubble {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 3;
  max-width: min(240px, 72%);
  padding: 6px 10px 7px;
  background: var(--bubble);
  color: var(--bubble-ink);
  border: 1px solid var(--bubble-line);
  border-radius: 9px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.4;
  pointer-events: none;
  box-shadow: 0 6px 16px -10px rgba(0, 0, 0, .45);
  transition: opacity .3s ease;
}
.bubble::after {
  content: "";
  position: absolute;
  left: var(--tail, 50%);
  bottom: -5px;
  width: 8px;
  height: 8px;
  background: var(--bubble);
  border-right: 1px solid var(--bubble-line);
  border-bottom: 1px solid var(--bubble-line);
  transform: translateX(-50%) rotate(45deg);
}
.bubble.fade { opacity: 0; }

/* ---------- log content */
.ln { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.user { color: var(--ink); margin-top: 10px; }
.ln.user::before { content: "> "; color: var(--muted); }
.ln.out { color: var(--muted); padding-left: 3ch; text-indent: -3ch; }
.ln.out::before { content: "\23BF  "; color: var(--faint); }
.ln.out b { color: var(--ink); font-weight: 500; }
.ln.sys { color: var(--accent); margin-top: 10px; }
.ln.eaten { color: var(--faint); font-style: italic; }
.help {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  column-gap: 16px;
  row-gap: 1px;
  margin: 4px 0 2px 3ch;
  font-size: 12.5px;
}
.help dt { color: var(--ink); white-space: nowrap; }
.help dd { margin: 0; color: var(--muted); }
.card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-areas: "pic head" "pic stats" "bio bio" "meta meta";
  column-gap: 14px;
  align-items: start;
  max-width: 460px;
  margin: 8px 0 4px 3ch;
  padding: 12px 14px 12px 10px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: var(--panel);
}
.card canvas { grid-area: pic; image-rendering: pixelated; display: block; margin-top: 2px; }
.card .hd { grid-area: head; }
.card .nm { font-family: var(--font-pixel); font-weight: 600; font-size: 24px; line-height: 1.05; color: var(--ink); }
.card .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.stars { color: var(--gold); letter-spacing: 1px; font-size: 11px; }
.card .stats {
  grid-area: stats;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) 3ch;
  gap: 3px 10px;
  align-items: center;
  margin: 8px 0 0;
  font-size: 11px;
}
.card dt { color: var(--muted); letter-spacing: .06em; }
.card dd { margin: 0; }
.pips {
  display: block;
  height: 7px;
  background: linear-gradient(90deg, var(--gold) calc(var(--v) * 1%), var(--line-2) 0);
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 2px), transparent 0 10%);
  mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 2px), transparent 0 10%);
}
.card .n { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.card .bio { grid-area: bio; margin: 10px 0 0 4px; color: var(--ink-2); font-size: 12.5px; }
.card .meta { grid-area: meta; margin: 4px 0 0 4px; color: var(--faint); font-size: 11.5px; }

/* ---------- status + prompt */
.status {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-height: 27px;
  padding: 8px 2px 0;
  color: var(--muted);
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
}
.status .spin { color: var(--accent); display: inline-block; width: 1.3em; text-align: center; flex: none; }
.status .st { overflow: hidden; text-overflow: ellipsis; }
.status .st b { color: var(--ink); font-weight: 500; }
.status .el { color: var(--faint); flex: none; }
.prompt {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 0;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: var(--page);
}
.prompt:focus-within { border-color: var(--muted); }
.prompt:has(#cmd:focus-visible) { border-color: var(--accent); }
.prompt .caret { color: var(--muted); }
#cmd {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
  padding: 11px 0;
}
#cmd::placeholder { color: var(--faint); }
.suggest {
  position: absolute;
  left: -1px;
  right: -1px;
  bottom: calc(100% + 6px);
  z-index: 6;
  margin: 0;
  padding: 4px;
  list-style: none;
  max-height: 232px;
  overflow-y: auto;
  background: var(--page);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
.suggest li {
  display: grid;
  grid-template-columns: minmax(0, 19ch) minmax(0, 1fr);
  gap: 12px;
  padding: 5px 8px;
  border-radius: 5px;
  font-size: 12.5px;
  cursor: pointer;
}
.suggest .c { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest .d { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.suggest li[aria-selected="true"] { background: var(--sel); }
.suggest li[aria-selected="true"] .c { color: var(--accent); }
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding: 10px 2px 0;
  font-size: 11.5px;
}
.needs { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.need { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.meter { position: relative; display: block; width: 42px; height: 6px; background: var(--line); }
.meter > span { position: absolute; inset: 0 auto 0 0; width: calc(var(--v, 50) * 1%); background: var(--good); }
.meter::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 7.4px, var(--page) 7.4px 8.4px);
}
.need.warn .meter > span { background: var(--warn); }
.need.bad .meter > span { background: var(--bad); }

/* ---------- action chips */
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip, .seg button {
  font: inherit;
  font-size: 12.5px;
  color: var(--ink);
  background: var(--page);
  border: 1px solid var(--line-2);
  cursor: pointer;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  border-radius: 8px;
}
.chip svg { display: block; color: var(--ink-2); flex: none; }
.chip[data-icon="heart"] svg { color: var(--icon-heart); }
.chip[data-icon="grass"] svg { color: var(--icon-grass); }
.chip[data-icon="star"] svg, .chip[data-icon="crown"] svg { color: var(--icon-gold); }
.chip[data-icon="moon"] svg { color: var(--icon-moon); }
.chip:hover, .seg button:hover { border-color: var(--muted); }
.chip:active { transform: translateY(1px); }
.seg { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 12px; }
.seg .opts { display: inline-flex; }
.seg button { padding: 7px 10px; margin-left: -1px; }
.seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); position: relative; }
.chip:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
@media (max-width: 520px) {
  .seg { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .screen.shake { animation: none; }
  .bubble { transition: none; }
}

/* ---------- simple mode: only the goat, transparent, for iframes */
html.simple { color-scheme: normal !important; }
html.simple[data-schema="dunkel"] { color-scheme: dark !important; }
html.simple[data-schema="hell"] { color-scheme: light !important; }
html.simple, html.simple body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent !important;
}
html.simple .wrap { display: block; max-width: none; margin: 0; padding: 0; height: 100%; }
html.simple .screen { position: absolute; inset: 0; }
html.simple .meadow { position: absolute; inset: 0; height: auto; }
html.simple .log,
html.simple .status,
html.simple .prompt,
html.simple .foot,
html.simple .actions { display: none !important; }
html.simple .meadow { cursor: default; }
html.simple .bubble { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
html.simple[data-farben="hell"] {
  --bubble: #ffffff; --bubble-ink: #1f231f; --bubble-line: #cdd1c6;
  --mtn1: #eceee7; --mtn2: #e3e7de; --snow: #ffffff;
  --gpx: #8cc56f; --gpx2: #6aa954; --soil: #ddd6c6; --soil2: #cdc4b1;
}
html.simple[data-farben="dunkel"] {
  --bubble: #1f2522; --bubble-ink: #e6e9e2; --bubble-line: #3a423c;
  --mtn1: #1b201d; --mtn2: #1f2622; --snow: #2c3430;
  --gpx: #4f8f45; --gpx2: #3c7336; --soil: #221f1a; --soil2: #1a1814;
}
html.simple[data-blase="hell"] .bubble { --bubble: #ffffff; --bubble-ink: #1f231f; --bubble-line: #cdd1c6; }
html.simple[data-blase="dunkel"] .bubble { --bubble: #1f2522; --bubble-ink: #e6e9e2; --bubble-line: #3a423c; }
</style>

</head>
<body>
<main class="wrap">
  <div class="pet">
    <div class="screen" id="screen">
      <div class="log" id="log" role="log" aria-live="polite" aria-label="Verlauf"></div>
      <div class="meadow" id="meadow" aria-hidden="true"></div>
      <div class="handle" id="handle" aria-hidden="true" hidden></div>
      <canvas id="world" role="img" aria-label="Pixel-Ziege"></canvas>
      <div class="bubble" id="bubble" hidden></div>
      <div class="sr" id="sr" aria-live="polite"></div>
    </div>
    <div class="status" id="status" aria-hidden="true"><span class="spin" id="spin">✶</span><span class="st" id="statusText"></span><span class="el" id="statusEl"></span></div>
    <form class="prompt" id="prompt" autocomplete="off">
      <span class="caret" aria-hidden="true">&gt;</span>
      <label class="sr" for="cmd">Nachricht an deine Ziege oder Befehl</label>
      <input id="cmd" name="cmd" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Schreib Hörnli etwas …">
      <ul class="suggest" id="suggest" role="listbox" aria-label="Befehle" hidden></ul>
    </form>
    <div class="foot">
      <span class="needs">
        <span class="need" id="nFood">Satt <span class="meter"><span></span></span></span>
        <span class="need" id="nMood">Laune <span class="meter"><span></span></span></span>
        <span class="need" id="nEnergy">Energie <span class="meter"><span></span></span></span>
      </span>
    </div>
  </div>

  <nav class="actions" aria-label="Aktionen">
    <button class="chip" type="button" data-cmd="/buddy pet" data-icon="heart">Streicheln</button>
    <button class="chip" type="button" data-cmd="/buddy feed" data-icon="grass">Füttern</button>
    <button class="chip" type="button" data-cmd="/buddy trick" data-icon="star">Kunststück</button>
    <button class="chip" type="button" data-cmd="/buddy mäh" data-icon="speech">Mäh!</button>
    <button class="chip" type="button" data-cmd="/buddy hat" data-icon="crown">Hut</button>
    <button class="chip" type="button" data-cmd="/buddy card" data-icon="card">Steckbrief</button>
    <button class="chip" type="button" data-cmd="/buddy sleep" data-icon="moon" id="sleepChip"><span>Schlafen</span></button>
    <button class="chip" type="button" data-cmd="/buddy sound" data-icon="sound" id="soundChip" aria-pressed="false"><span>Ton aus</span></button>
    <span class="seg" role="group" aria-label="Grösse der Ziege">Grösse
      <span class="opts">
        <button type="button" data-size="2" aria-pressed="false">S</button><button type="button" data-size="3" aria-pressed="true">M</button><button type="button" data-size="4" aria-pressed="false">L</button>
      </span>
    </span>
  </nav>
</main>

<script>

      if (!kv) return;
      const i = kv.indexOf('=');
      let k, v;
      try {
        k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
        v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
      } catch (e) { return; }
      const nk = norm(k);
      if (i < 0 && /^(simpel|simple|einfach|iframe|embed)$/.test(nk)) raw.modus = nk;

/* ================================================================ sprites */
const FR = ART.frames, PR = ART.props, HT = ART.hats, HA = ART.hatAnchor;
const PAL = ART.pal;

const FW = ART.W, FH = ART.H;
const cache = new Map();
function paint(grid, pal, flip, map) {
  const h = grid.length, w = grid[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      let ch = grid[j][i];
      if (map) ch = map(ch, i, j);
      if (ch === '.' || !pal[ch]) continue;
      x.fillStyle = pal[ch];
      x.fillRect(flip ? w - 1 - i : i, j, 1, 1);
    }
  }
  return c;
}
const META = {};
for (const k in FR) {
  let top = 99, x0 = 99, y0 = 99, x1 = -1, y1 = -1;
  FR[k].forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch === '.') continue;
      if ((ch === 'e' || ch === 'l') && j < top) top = j;
      if (i < x0) x0 = i; if (i > x1) x1 = i;
      if (j < y0) y0 = j; if (j > y1) y1 = j;
    }
  });
  META[k] = { top, box: [x0, y0, x1, y1] };
}
function goatSprite(frame, eye, flip) {
  const key = 'g' + frame + eye + (flip ? 1 : 0);
  let c = cache.get(key);
  if (!c) {
    const top = META[frame].top;
    const map = eye === 'open' ? null : (ch, i, j) =>
      (ch === 'l' || (ch === 'e' && j === top)) ? 'w' : (eye === 'happy' && ch === 'c') ? 'p' : ch;
    c = paint(FR[frame], PAL, flip, map);
    cache.set(key, c);

}
function propSprite(name, flip) {
  const key = 'p' + name + (flip ? 1 : 0);
  let c = cache.get(key);
  if (!c) { c = paint(PR[name], PAL, flip); cache.set(key, c); }
  return c;
}

  const key = 'h' + name + (flip ? 1 : 0);
  let c = cache.get(key);
  if (!c) { c = paint(HT[name], PALH, flip); cache.set(key, c); }

}

function layout() {
  dpr = window.devicePixelRatio || 1;
  P = Math.max(1, Math.round(S.size * dpr));
  if (!SIMPLE) screenEl.style.setProperty('--meadow-h', (STAGE * P / dpr) + 'px');
  const r = screenEl.getBoundingClientRect();
  SW = r.width; SH = r.height;
  const oldAW = AW;
  const nAW = Math.max(SIMPLE ? 30 : 60, Math.ceil(SW * dpr / P));
  const nAH = Math.max(SIMPLE ? 22 : STAGE + 4, Math.ceil(SH * dpr / P));
  if (nAW === AW && nAH === AH && canvas.width === AW * P && dpr === lastDpr) return;
  lastDpr = dpr;
  AW = nAW; AH = nAH;
  GY = AH - (CFG.boden ? 4 : 1);
  buf.width = AW; buf.height = AH;
  canvas.width = AW * P; canvas.height = AH * P;
  canvas.style.width = (AW * P / dpr) + 'px';
  canvas.style.height = (AH * P / dpr) + 'px';
  if (oldAW) {
    const k = AW / oldAW;
    goat.x *= k;
    if (world.rock != null) world.rock = Math.round(world.rock * k);
    world.tufts.forEach((t) => { t.x = Math.round(t.x * k); });
    if (act.target != null) act.target *= k;
    if (act.x0 != null) { act.x0 *= k; act.x1 *= k; }
    if (act.ex != null) act.ex = Math.round(act.ex * k);
  } else if (CFG.felsen) {
    world.rock = Math.round(AW * 0.78);
  }
  goat.x = clamp(goat.x, 12, AW - 12);
  bubbleEl.style.fontSize = S.size <= 1 ? '10.5px' : S.size === 2 ? '11.5px' : '';

}

function drawBackground() {
  bg.width = AW; bg.height = AH;
  const g = bgx;
  g.clearRect(0, 0, AW, AH);
  if (!CFG.berge && !CFG.boden) return;
  const rnd = mulberry32(11);
  const noise = [];
  for (let i = 0; i < AW + 4; i++) noise.push(rnd());
  const base = GY + 1;
  if (CFG.berge) {
    const ps = clamp((GY - 6) / 34, 0.3, 1);
    const peaks = [
      { c: 0.13, h: 28, wl: 0.10, wr: 0.065 },
      { c: 0.29, h: 17, wl: 0.12, wr: 0.10 },
      { c: 0.49, h: 22, wl: 0.13, wr: 0.15 },
      { c: 0.67, h: 14, wl: 0.10, wr: 0.10 },
      { c: 0.88, h: 24, wl: 0.12, wr: 0.11 },
    ];
    for (let x = 0; x < AW; x++) {
      const u = x / AW;
      let h = 4 + (noise[x] > 0.82 ? 1 : 0);
      for (const p of peaks) {
        const w = u < p.c ? p.wl : p.wr;
        const d = Math.abs(u - p.c) / w;
        if (d < 1) h = Math.max(h, p.h * ps * Math.pow(1 - d, 1.15) + (noise[x] - 0.5) * 1.4);
      }
      h = Math.round(h);
      const line = 13 * ps;
      const snow = h > line ? Math.round((h - line) * 0.62 + (noise[x + 1] > 0.5 ? 1 : 0)) : 0;
      g.fillStyle = TC.mtn1;
      g.fillRect(x, base - h, 1, h);
      if (snow > 0) { g.fillStyle = TC.snow; g.fillRect(x, base - h, 1, snow); }
      const hill = Math.round((3 + 2.4 + 2.4 * Math.sin(u * 11 + 1.3) + 1.4 * Math.sin(u * 29 + 0.4)) * ps);
      g.fillStyle = TC.mtn2;
      g.fillRect(x, base - hill, 1, hill);
    }
  }
  if (CFG.boden) {
    for (let x = 0; x < AW; x++) {
      g.fillStyle = noise[(x * 7) % AW] > 0.7 ? TC.gpx2 : TC.gpx;
      g.fillRect(x, base, 1, 1);
      g.fillStyle = TC.soil;
      g.fillRect(x, base + 1, 1, AH - base - 1);
      if (noise[(x * 3 + 5) % AW] > 0.86) { g.fillStyle = TC.soil2; g.fillRect(x, base + 2, 1, 1); }
      if (noise[(x * 5 + 1) % AW] > 0.8) { g.fillStyle = TC.gpx2; g.fillRect(x, base - 1, 1, 1); }
    }
  }
}

/* ================================================================ sound */
let actx = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = new AC(); } catch (e) { return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(ac, type, f0, f1, dur, vol, when) {
  const t = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name) {
  if (!S.sound) return;
  const ac = audio();
  if (!ac) return;
  const t = ac.currentTime;
  if (name === 'bleat') {
    const dur = 0.72;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(310, t);
    o.frequency.linearRampToValueAtTime(430, t + 0.07);
    o.frequency.linearRampToValueAtTime(395, t + 0.45);
    o.frequency.linearRampToValueAtTime(330, t + dur);
    const trem = ac.createOscillator(); trem.frequency.value = 23;
    const tg = ac.createGain(); tg.gain.value = 0.42;
    const amp = ac.createGain(); amp.gain.value = 0.55;
    trem.connect(tg); tg.connect(amp.gain);
    const env = ac.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.5, t + 0.04);
    env.gain.setValueAtTime(0.5, t + dur - 0.22);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(amp);
    [[760, 4, 1], [1750, 6, 0.55], [2650, 8, 0.22]].forEach(([f, q, v]) => {
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
      const gg = ac.createGain(); gg.gain.value = v;
      amp.connect(bp); bp.connect(gg); gg.connect(env);
    });
    env.connect(ac.destination);
    o.start(t); trem.start(t); o.stop(t + dur + 0.05); trem.stop(t + dur + 0.05);
  } else if (name === 'bell') {
    [[1318, 0.09, 1.1], [3640, 0.035, 0.5], [7115, 0.015, 0.3]].forEach(([f, v, d]) => tone(ac, 'sine', f, f * 0.998, d, v));
  } else if (name === 'pop') {
    tone(ac, 'sine', 520, 1300, 0.09, 0.12);
  } else if (name === 'thud') {
    tone(ac, 'sine', 160, 60, 0.12, 0.12);
  } else if (name === 'tick') {
    tone(ac, 'square', 1800, 900, 0.03, 0.04);
  } else if (name === 'bonk') {
    tone(ac, 'triangle', 300, 90, 0.18, 0.2);
    tone(ac, 'sine', 1200, 1400, 0.25, 0.04, 0.05);
  } else if (name === 'nom') {
    tone(ac, 'triangle', 140 + Math.random() * 40, 90, 0.06, 0.08);
  } else if (name === 'boing') {
    tone(ac, 'triangle', 220, 480, 0.13, 0.06);
  }
}

function hatHeight() { return S.hat === 'keiner' ? 0 : HT[S.hat].length; }

function placeBubble() {

/* ================================================================ grab handle (follows the goat) */
let handleKey = '';
function upHandle() {
  if (goat.hidden || !(CFG.streicheln || CFG.hochheben)) { if (!handleEl.hidden) handleEl.hidden = true; return; }
  const flip = goat.face < 0;
  const b = META[goat.frame].box;
  const x0 = flip ? FW - 1 - b[2] : b[0], x1 = flip ? FW - 1 - b[0] : b[2];
  const k = P / dpr;
  const canvasTop = SH - AH * k;
  const pad = 2, hh = hatHeight();
  const l = Math.round((spriteLeft() + x0 - pad) * k);
  const t = Math.round(canvasTop + (spriteTop() + b[1] - pad - hh) * k);
  const w = Math.round((x1 - x0 + 1 + pad * 2) * k);
  const h = Math.round((b[3] - b[1] + 1 + pad * 2 + hh) * k);
  const key = l + ',' + t + ',' + w + ',' + h;
  if (key !== handleKey) {
    handleKey = key;
    handleEl.style.transform = 'translate(' + l + 'px,' + t + 'px)';
    handleEl.style.width = w + 'px';
    handleEl.style.height = h + 'px';
  }
  if (handleEl.hidden) handleEl.hidden = false;

/* ================================================================ particles */
const parts = [];
function spawn(s, x, y, o) {
  const g = PR[s];
  parts.push(Object.assign({ s, x, y, vx: 0, vy: 0, g: 0, life: 1, max: 1, w: g[0].length, h: g.length }, o));
}
function upParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

/* ================================================================ world */
function nearRock(x, d) { return world.rock != null && Math.abs(x - world.rock) < d; }
function addTuft(x, kind, stage, fast) {
  if (x == null) return null;
  const t = { x: Math.round(x), kind, stage: kind === 'flower' ? 3 : stage, grow: fast ? 0.3 : 6, fast: !!fast };
  world.tufts.push(t);
  if (world.tufts.length > 6) world.tufts.shift();
  return t;
}
function freeX() {
  for (let i = 0; i < 24; i++) {
    const x = Math.round(rand(10, AW - 10));
    if (nearRock(x, 13)) continue;
    if (world.tufts.some((t) => Math.abs(t.x - x) < 7)) continue;
    return x;
  }
  return null;
}
function nearestTuft() {
  let best = null, bd = 1e9;
  for (const t of world.tufts) {
    if (t.stage < 3) continue;
    const d = Math.abs(t.x - goat.x);
    if (d < bd) { bd = d; best = t; }
  }
  return best;
}
function mouthX() { return goat.x + goat.face * 9; }
function mouthTuft() { return world.tufts.find((t) => t.stage >= 3 && Math.abs(t.x - mouthX()) <= 3) || null; }
function removeTuft(t) { const i = world.tufts.indexOf(t); if (i >= 0) world.tufts.splice(i, 1); }
let spawnT = rand(14, 24);
function upWorld(dt) {
  for (const t of world.tufts) {
    if (t.kind === 'grass' && t.stage < 3 && !t.eating) {
      t.grow -= dt;
      if (t.grow <= 0) { t.stage++; t.grow = t.fast ? 0.3 : 6; }
    }
  }
  if (!CFG.gras) return;
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = rand(22, 40);
    if (world.tufts.length < 4) addTuft(freeX(), Math.random() < 0.18 ? 'flower' : 'grass', 1, false);
  }
}

/* ================================================================ needs */
function upNeeds(dt) {
  if (!CFG.beduerfnisse) return;
  if (FOOD_SOURCE) needs.food = clamp(needs.food - 0.1 * dt, 0, 100);
  if (act.type === 'sleep') needs.energy = clamp(needs.energy + 1.5 * dt, 0, 100);
  else if (act.type === 'lie') needs.energy = clamp(needs.energy + 0.3 * dt, 0, 100);
  else if (!goat.off && CFG.schlafen) needs.energy = clamp(needs.energy - (['jump', 'charge', 'held', 'fall'].includes(act.type) ? 0.5 : 0.07) * dt, 0, 100);
  const target = FOOD_SOURCE && needs.food < 20 ? 30 : 58;
  needs.mood = clamp(needs.mood + (target - needs.mood) * 0.004 * dt, 0, 100);
}

/* ================================================================ actions */
function setAct(type, o) {
  if (act.type === 'nibble' && !act.done && act.el) {
    act.done = true;
    act.el.classList.add('eaten');
    act.el.textContent = '(von ' + S.name + ' angeknabbert)';
  }
  if (act.type === 'graze' && act.tuft) act.tuft.eating = false;
  act = Object.assign({ type, t: 0 }, o || {});
}
function setIdle(dur, o) { setAct('idle', Object.assign({ dur: dur == null ? rand(2, 5) : dur, seq: 0, tick: 0.42 }, o || {})); }
const IDLE_SEQ = ['stand', 'stand', 'breathe', 'stand', 'tail', 'stand', 'breathe', 'chewL', 'chewR', 'chewL', 'chewR', 'stand', 'breathe', 'stand', 'ear', 'stand', 'breathe', 'stand'];
const CHEW = 7;

function upIdle(dt) {
  act.tick -= dt;
  if (act.tick <= 0) { act.tick = 0.42; act.seq = (act.seq + 1) % IDLE_SEQ.length; }
  goat.frame = IDLE_SEQ[act.seq];
  if (act.t > act.dur) decide();
}

function walkTo(x, o) {
  if (goat.onRock) { jumpOffRock(() => walkTo(x, o)); return; }
  o = o || {};
  const speed = (o.speed || rand(10, 14)) * CFG.tempo;
  setAct('walk', Object.assign({ target: clamp(x, 12, AW - 12), step: 0, fi: 0, verb: 'walk' }, o, { speed }));
}
function upWalk(dt) {
  const dx = act.target - goat.x;
  if (Math.abs(dx) < 0.6) {
    goat.x = act.target; goat.frame = 'stand';
    const then = act.then;
    setIdle();
    if (then) then();
    return;
  }
  goat.face = dx > 0 ? 1 : -1;
  const mv = Math.min(Math.abs(dx), act.speed * dt);
  goat.x += mv * goat.face;
  act.step += mv;
  if (act.step > (act.speed > 16 ? 1.6 : 2.2)) { act.step = 0; act.fi = (act.fi + 1) % 4; }
  goat.frame = ['walkA', 'stand', 'walkB', 'stand'][act.fi];
}

function jumpTo(x1, y1, o) {
  setAct('jump', Object.assign({ x0: goat.x, y0: goat.y, x1, y1, T: 0.52, h: 9, crouch: 0.1 }, o || {}));
  if (Math.abs(x1 - goat.x) > 0.5) goat.face = x1 > goat.x ? 1 : -1;
}
function upJump() {
  if (act.t < act.crouch) { goat.frame = 'land'; return; }
  const u = (act.t - act.crouch) / act.T;
  if (u < 1) {
    if (!act.boinged) { act.boinged = true; sfx('boing'); }
    goat.x = lerp(act.x0, act.x1, u);
    goat.y = lerp(act.y0, act.y1, u) + 4 * act.h * u * (1 - u);
    goat.frame = 'hop';
    if (act.flip && u > 0.5 && !act.flipped) { goat.face *= -1; act.flipped = true; }
    return;
  }
  goat.x = act.x1; goat.y = act.y1;
  goat.onRock = act.y1 >= ROCK_H - 0.5;
  if (act.landed == null) { act.landed = act.t; sfx('thud'); }
  goat.frame = 'land';
  if (act.t - act.landed > 0.12) {
    const then = act.then;
    setIdle();
    if (then) then();
  }
}
function hopInPlace(n, then) {
  const y = goat.y;
  jumpTo(goat.x, y, { h: 10, T: 0.44, verb: 'macht Bocksprünge', then: () => (n > 1 ? hopInPlace(n - 1, then) : then && then()) });
}
function goClimb() {
  if (world.rock == null) return setIdle();
  const side = goat.x < world.rock ? -1 : 1;
  let sx = world.rock + side * 16;
  if (sx < 12 || sx > AW - 12) sx = world.rock - side * 16;
  walkTo(sx, {
    verb: 'toRock',
    then: () => {
      jumpTo(world.rock, ROCK_H, { h: 8, T: 0.5, verb: 'klettert', then: () => { say(pick(L.rock)); setIdle(rand(4, 7)); } });
    },
  });
}
function jumpOffRock(then) {
  const side = Math.random() < 0.5 ? -1 : 1;
  let x = world.rock + side * 17;
  if (x < 12 || x > AW - 12) x = world.rock - side * 17;
  jumpTo(x, 0, { h: 6, T: 0.5, verb: 'springt vom Felsen', then });
}

function startGraze(tuft) {
  setAct('graze', { tuft, dur: tuft.kind === 'flower' ? 1.8 : 2.6, fi: 0, tick: 0 });
  tuft.eating = true;
}
function goEat(tuft) {
  if (!CFG.laufen) {
    if (Math.abs(tuft.x - mouthX()) <= 3 && !goat.onRock) startGraze(tuft);
    else setIdle();
    return;
  }
  const dir = tuft.x >= goat.x ? 1 : -1;
  walkTo(tuft.x - 9 * dir, {
    speed: needs.food < 40 ? 21 : 14,
    verb: 'trot',
    then: () => {
      if (!world.tufts.includes(tuft)) { say('Wo ist das Gras hin?'); return; }
      goat.face = tuft.x >= goat.x ? 1 : -1;
      startGraze(tuft);
    },
  });
}
function upGraze(dt) {
  act.tick -= dt;
  if (act.tick <= 0) { act.tick = 0.24; act.fi ^= 1; if (act.fi && Math.random() < 0.6) crumb(); if (act.fi) sfx('nom'); }
  goat.frame = act.fi ? 'graze2' : 'graze';
  const tf = act.tuft;
  if (tf.kind === 'grass' && world.tufts.includes(tf)) {
    const k = act.t / act.dur;
    tf.stage = k < 0.34 ? 3 : k < 0.67 ? 2 : 1;
  }
  if (act.t >= act.dur) {
    removeTuft(tf);
    if (CFG.beduerfnisse) {
      needs.food = clamp(needs.food + (tf.kind === 'flower' ? 12 : 22), 0, 100);
      needs.mood = clamp(needs.mood + 4, 0, 100);
    }
    S.eaten++;
    if (tf.kind === 'flower') say(pick(L.flower));
    else if (Math.random() < 0.45) say(pick(L.eat));
    setIdle(rand(2.5, 4), { seq: CHEW, tick: 0.3 });
  }
}

function goLie() { setAct('lie', { dur: rand(8, 14), fi: 0, tick: 1 }); }
function upLie(dt) {
  if (act.t < 0.16) { goat.frame = 'land'; return; }
  act.tick -= dt;
  if (act.tick <= 0) { act.tick = 1.0; act.fi ^= 1; }
  goat.frame = act.fi ? 'lie2' : 'lie';
  if (CFG.schlafen && CFG.beduerfnisse && needs.energy < 18) { goSleep(); return; }
  if (act.t > act.dur) setAct('rise', { dur: 0.18 });
}
function goSleep() { setAct('sleep', { fi: 0, tick: 1.3, zT: 0.8 }); }
function upSleep(dt) {
  if (act.t < 0.16) { goat.frame = 'land'; return; }
  act.tick -= dt;
  if (act.tick <= 0) { act.tick = 1.3; act.fi ^= 1; }
  goat.frame = act.fi ? 'lie2' : 'lie';
  act.zT -= dt;
  if (act.zT <= 0) { act.zT = 1.5; spawnZ(); }
  if (needs.energy >= 99.5 || (!CFG.beduerfnisse && act.t > 20)) wake(false);
}
function wake(byUser) {
  setAct('rise', { dur: 0.25 });
  if (byUser) { needs.mood = clamp(needs.mood - 4, 0, 100); say(pick(L.wake)); }
  else say('Ausgeschlafen! Mäh!');
}
function upRise() {
  goat.frame = 'land';
  if (act.t > act.dur) { const then = act.then; setIdle(rand(1.5, 3)); if (then) then(); }
}

let petTimes = [];
function doPet(fromCmd) {
  if (goat.off) { out(S.name + ' ist gerade nicht da. /buddy on holt sie zurück.'); return; }
  if (act.type === 'hatch') return;
  if (act.type === 'sleep') { wake(true); if (fromCmd) out(S.name + ' blinzelt dich verschlafen an.'); return; }
  if (['held', 'fall', 'jump', 'charge'].includes(act.type)) return;
  const now = performance.now();
  petTimes = petTimes.filter((t) => now - t < 2600);
  petTimes.push(now);
  if (!fromCmd && petTimes.length >= 6) { petTimes = []; startCharge('overpet'); return; }
  const cont = act.type === 'pet';
  setAct('pet', { dur: 2.5, hT: 0, fi: 0, tick: 0.4 });
  needs.mood = clamp(needs.mood + 10, 0, 100);
  if (!cont || Math.random() < 0.35) say(pick(L.pet));
  if (!cont) sfx('bell');
  if (fromCmd) out(S.name + ' schliesst die Augen und geniesst es. ♥');
}
function upPet(dt) {
  act.tick -= dt;
  if (act.tick <= 0) { act.tick = 0.4; act.fi ^= 1; }
  goat.frame = act.fi ? 'breathe' : 'stand';
  act.hT -= dt;
  if (act.hT <= 0) { act.hT = 0.24; spawnHeart(); }
  if (act.t > act.dur) setIdle(rand(1.5, 3));
}

function doBleat(text) {
  setAct('bleat', { dur: 1.05 });
  say(text || pick(L.bleat));
  sfx('bleat');
}
function upBleat() {
  goat.frame = act.t < 0.85 ? 'bleat' : 'stand';
  goat.jx = (!REDUCE && act.t < 0.6 && Math.floor(act.t * 24) % 2) ? 1 : 0;
  if (act.t > act.dur) { const then = act.then; setIdle(); if (then) then(); }
}

function startCharge(reason) {
  setAct('charge', { x0: goat.x, dir: goat.face, dist: goat.onRock || !CFG.laufen ? 0 : 14 });
  say(reason === 'overpet' ? pick(L.overpet) : 'MÄH! Nimm das zurück!');
}
function upCharge() {
  const t = act.t, back = act.dist ? 2 : 0;
  if (t < 0.25) { goat.frame = 'land'; goat.x = act.x0 - act.dir * (t / 0.25) * back; }
  else if (t < 0.5) {
    goat.frame = 'graze';
    const u = (t - 0.25) / 0.25;
    goat.x = act.x0 - act.dir * back + act.dir * (act.dist + back) * u;
  } else if (!act.bonked) { act.bonked = true; bonk(); }
  else if (t < 0.8) { goat.frame = 'graze'; goat.x = act.x0 + act.dir * (act.dist - (act.dist ? 4 : 0) * ((t - 0.5) / 0.3)); }
  else setIdle(rand(1.5, 2.5));
  goat.x = clamp(goat.x, 12, AW - 12);
}
function bonk() {
  const flip = goat.face < 0;
  const fx = spriteLeft() + (flip ? 1 : FW - 2);
  const fy = GY - 8 - Math.round(goat.y);
  for (let i = 0; i < 3; i++) spawn('star', fx, fy, { vx: goat.face * rand(8, 20), vy: rand(-26, -8), g: 40, life: 0.7, max: 0.7 });
  sfx('bonk');
  if (!REDUCE) { screenEl.classList.remove('shake'); void screenEl.offsetWidth; screenEl.classList.add('shake'); }
}

function grab() {
  setAct('held', { fi: 0, tick: 0.16 });
  goat.onRock = false;
  const [hx, hy] = headPos();
  spawn('bang', hx, hy - 4, { life: 0.6, max: 0.6 });
  say(pick(L.held));
}
function upHeld(dt) {
  act.tick -= dt;
  if (act.tick <= 0) { act.tick = 0.16; act.fi ^= 1; }
  goat.frame = act.fi ? 'dangleB' : 'dangleA';
}
function release(vx, vy) {
  goat.vx = clamp(vx, -170, 170);
  goat.vy = clamp(vy, -60, 230);
  setAct('fall', { hmax: goat.y, bounced: false });
}
function upFall(dt) {
  const prevY = goat.y;
  goat.vy -= 420 * dt;
  goat.y += goat.vy * dt;
  goat.x += goat.vx * dt;
  if (goat.x < 12) { goat.x = 12; goat.vx = Math.abs(goat.vx) * 0.5; }
  if (goat.x > AW - 12) { goat.x = AW - 12; goat.vx = -Math.abs(goat.vx) * 0.5; }
  if (Math.abs(goat.vx) > 8) goat.face = goat.vx > 0 ? 1 : -1;
  goat.frame = 'hop';
  act.hmax = Math.max(act.hmax, goat.y);
  const floor = nearRock(goat.x, 6) && prevY >= ROCK_H - 0.01 ? ROCK_H : 0;
  if (goat.y <= floor && goat.vy <= 0) {
    goat.y = floor;
    goat.onRock = floor > 0;
    sfx('thud');
    if (goat.vy < -130 && !act.bounced) { goat.vy = -goat.vy * 0.28; goat.vx *= 0.5; act.bounced = true; return; }
    const fell = act.hmax - floor;
    goat.vx = goat.vy = 0;
    setAct('rise', { dur: fell > 18 ? 0.35 : 0.18, then: () => { if (fell > 16) say(goat.onRock ? 'Punktlandung auf dem Felsen!' : pick(L.drop)); } });
  }
}

function eatMessage(el, text) {
  setAct('nibble', { el, text, i: text.length, tick: 0.35, fi: 0, ct: 0 });
}
function upNibble(dt) {
  act.ct -= dt;
  if (act.ct <= 0) { act.ct = 0.12; act.fi ^= 1; }
  goat.frame = act.fi ? 'chewL' : 'chewR';
  act.tick -= dt;
  if (act.i > 0) {
    if (act.tick <= 0) {
      act.tick = 0.055;
      act.i = Math.max(0, act.i - (act.text.length > 60 ? 2 : 1));
      act.el.textContent = act.text.slice(0, act.i);
      if (act.i % 4 === 0) sfx('nom');
    }
  } else if (act.tick <= -0.3) finishNibble();
}
function finishNibble() {
  act.done = true;
  act.el.classList.add('eaten');
  act.el.textContent = '(von ' + S.name + ' gefressen)';
  if (CFG.beduerfnisse) needs.food = clamp(needs.food + 7, 0, 100);
  say(pick(L.eatmsg));
  setIdle(rand(2, 3), { seq: CHEW, tick: 0.3 });
}

const measure = document.createElement('canvas').getContext('2d');
function caretArtX() {
  const input = $('#cmd');
  const r = input.getBoundingClientRect(), sr = screenEl.getBoundingClientRect();
  const cs = getComputedStyle(input);
  measure.font = cs.fontSize + ' ' + cs.fontFamily;
  const w = Math.min(r.width, measure.measureText(input.value).width);
  return (r.left + w - sr.left) * dpr / P;
}
function watchTyping() {
  if (goat.hidden || !['idle', 'walk', 'watch'].includes(act.type)) return;
  if (act.type !== 'watch') setAct('watch', {});
  act.until = time + 1.6;
  const cx = caretArtX();
  if (Math.abs(cx - goat.x) > 3) goat.face = cx > goat.x ? 1 : -1;
}
function upWatch() {
  goat.frame = Math.floor(time * 2.5) % 7 === 0 ? 'ear' : 'stand';
  if (time > act.until) setIdle(rand(1, 2.5));
}

function startHatch() {
  goat.hidden = true;
  goat.onRock = false;
  setAct('hatch', { ex: Math.round(AW * startFrac()), ey: Math.max(6, Math.min(AH - 14, 90)), vy: 0, bounced: false, st: 'egg', wob: 0, rest: null });
}
function upHatch(dt) {
  const a = act;
  if (a.rest == null) {
    a.vy -= 320 * dt;
    a.ey += a.vy * dt;
    if (a.ey <= 0) {
      a.ey = 0;
      if (!a.bounced && a.vy < -40) { a.vy = -a.vy * 0.3; a.bounced = true; sfx('thud'); }
      else { a.vy = 0; a.rest = a.t; }
    }
    return;
  }
  const t = a.t - a.rest;
  const W = [0.35, 0.5, 0.65, 1.0, 1.15, 1.5, 1.6, 1.7];
  a.wob = 0;
  W.forEach((w, i) => { if (t > w && t < w + 0.08) a.wob = i % 2 ? -1 : 1; });
  if (t > 0.8 && a.st === 'egg') { a.st = 'egg_crack1'; sfx('tick'); }
  if (t > 1.35 && a.st === 'egg_crack1') { a.st = 'egg_crack2'; sfx('tick'); }
  if (t > 1.95) hatchPop();
}
function hatchPop() {
  const x = act.ex;
  const cy = GY - 6;
  for (let i = 0; i < 9; i++) spawn('shell', x + rand(-4, 4), cy + rand(-4, 2), { vx: rand(-45, 45), vy: rand(-95, -45), g: 260, life: 1.1, max: 1.1 });
  sparkles(x, cy, 7, 5);
  goat.hidden = false;
  goat.x = x; goat.y = 0; goat.face = 1;
  sfx('pop'); sfx('bell');
  jumpTo(x, 0, {
    h: 12, T: 0.5, crouch: 0.05, verb: 'schlüpft',
    then: () => {
      say('Mäh! … Ja, Ziegen schlüpfen aus Eiern. Frag nicht.', { ms: 5500 });
      if (!SIMPLE) { sys('✻ ' + S.name + ' ist geschlüpft!'); showCard(); }
      save();
    },
  });
}

/* ---------------------------------------------------------------- brain */
function decide() {
  if (goat.hidden) return;
  if (goat.onRock) {
    const r = Math.random();
    if (r < 0.45) return setIdle(rand(2.5, 5));
    if (r < 0.58) return doBleat(pick(L.rock));
    return jumpOffRock();
  }
  if (CFG.schlafen && CFG.beduerfnisse && needs.energy < 20) return goSleep();
  const tuft = CFG.laufen ? nearestTuft() : mouthTuft();
  if (tuft && CFG.beduerfnisse && needs.food < 45) return goEat(tuft);
  const opts = [['idle', 30], ['bleat', 3]];
  if (CFG.laufen) opts.push(['wander', 32]);
  if (CFG.schlafen) opts.push(['lie', CFG.beduerfnisse && needs.energy < 55 ? 16 : 5]);
  if (CFG.laufen && world.rock != null) opts.push(['climb', 7]);
  if (tuft) opts.push(['eat', !CFG.beduerfnisse || needs.food < 85 ? 18 : 4]);
  if (needs.mood > 55) opts.push(['hop', 6]);
  switch (weighted(opts)) {
    case 'idle': return setIdle(rand(2.5, 6));
    case 'wander': {
      let x = goat.x;
      for (let i = 0; i < 8 && Math.abs(x - goat.x) < 16; i++) x = rand(14, AW - 14);
      return walkTo(x);
    }
    case 'eat': return goEat(tuft);
    case 'lie': return goLie();
    case 'climb': return goClimb();
    case 'hop': return hopInPlace(Math.random() < 0.5 ? 1 : 2);
    case 'bleat': return doBleat(CFG.beduerfnisse && FOOD_SOURCE && needs.food < 30 ? pick(SIMPLE ? L.hungrySimple : L.hungry) : undefined);
  }
}
let chatT = rand(22, 34);
function upChatter(dt) {
  chatT -= dt;
  if (chatT > 0) return;
  chatT = rand(30, 58);
  if (!CFG.plappern || goat.hidden || !bubbleEl.hidden) return;
  if (!['idle', 'walk', 'lie', 'watch'].includes(act.type)) return;
  let pool = SIMPLE ? L.simple : L.idle;
  if (CFG.beduerfnisse && FOOD_SOURCE && needs.food < 30) pool = SIMPLE ? L.hungrySimple : L.hungry;
  else if (CFG.beduerfnisse && CFG.schlafen && needs.energy < 25) pool = L.sleepy;
  say(pick(pool));
}
let blinkT = 2.5;
function upBlink(dt) {
  blinkT -= dt;
  if (blinkT < -0.13) blinkT = rand(2.2, 5.5);
}

/* ================================================================ main step + render */
let saveT = 6;
function step(dt) {
  upNeeds(dt);
  upWorld(dt);
  upBlink(dt);
  goat.jx = 0;
  switch (act.type) {
    case 'idle': upIdle(dt); break;
    case 'walk': upWalk(dt); break;
    case 'jump': upJump(dt); break;
    case 'graze': upGraze(dt); break;
    case 'lie': upLie(dt); break;
    case 'sleep': upSleep(dt); break;
    case 'rise': upRise(dt); break;
    case 'pet': upPet(dt); break;
    case 'bleat': upBleat(dt); break;
    case 'charge': upCharge(dt); break;
    case 'held': upHeld(dt); break;
    case 'fall': upFall(dt); break;
    case 'nibble': upNibble(dt); break;
    case 'watch': upWatch(dt); break;
    case 'hatch': upHatch(dt); break;
    default: break;
  }
  if (act.type === 'sleep') goat.eye = 'closed';
  else if (act.type === 'pet') goat.eye = 'happy';
  else goat.eye = blinkT < 0 ? 'closed' : 'open';
  upParts(dt);
  upBubble(dt);
  upHandle();
  if (!SIMPLE) { upStatus(dt); upHud(dt); }
  upChatter(dt);
  saveT -= dt;
  if (saveT <= 0) { saveT = 6; save(); }
}

function drawHat(g, frame, left, top, flip, t) {
  if (S.hat === 'keiner') return;
  let name = S.hat;
  if (name === 'propeller') {
    const fast = act.type === 'walk' || act.type === 'jump' || act.type === 'fall' || act.type === 'held';
    name = Math.floor(t * (fast ? 14 : 5)) % 2 ? 'propeller2' : 'propeller';
  }
  const grid = HT[name];
  const hw = grid[0].length, hh = grid.length;
  const a = HA[frame] || [17, 3];
  let x0 = a[0] - (hw >> 1);
  const y0 = a[1] - hh + 1;
  if (flip) x0 = FW - 1 - (x0 + hw - 1);
  const bob = S.hat === 'heiligenschein' && Math.sin(t * 3) < 0 ? -1 : 0;
  g.drawImage(hatSprite(name, flip), left + x0, top + y0 + bob);
}

function render() {
  bx.clearRect(0, 0, AW, AH);
  bx.drawImage(bg, 0, 0);
  if (world.rock != null) bx.drawImage(propSprite('rock'), world.rock - 8, GY - (ROCK_H - 1));
  for (const t of world.tufts) {
    if (t.kind === 'flower') bx.drawImage(propSprite('flower'), t.x - 1, GY - 4);
    else bx.drawImage(propSprite('tuft' + t.stage), t.x - 2, GY - 3);
  }
  if (act.type === 'hatch') {
    bx.drawImage(propSprite(act.st), act.ex - 6 + act.wob, GY - 11 - Math.round(act.ey));
  }
  if (!goat.hidden) {
    const flip = goat.face < 0;
    const left = spriteLeft() + goat.jx;
    const top = spriteTop();
    if (goat.y > 1.5 && !goat.onRock) {
      const w = Math.max(4, 12 - Math.round(goat.y / 3));
      bx.globalAlpha = 0.18;
      bx.fillStyle = '#000';
      bx.fillRect(Math.round(goat.x) - (w >> 1) + (flip ? 1 : -1), GY, w, 1);
      bx.globalAlpha = 1;
    }
    bx.drawImage(goatSprite(goat.frame, goat.eye, flip), left, top);
    drawHat(bx, goat.frame, left, top, flip, time);
  }
  for (const p of parts) {
    const a = p.max ? clamp((p.life / p.max) * 2.2, 0, 1) : 1;
    bx.globalAlpha = Math.ceil(a * 4) / 4;
    bx.drawImage(propSprite(p.s), Math.round(p.x - p.w / 2), Math.round(p.y - p.h / 2));
  }
  bx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

function runCommand(raw) {
  const parts = raw.trim().split(/\s+/);
  const head = parts[0].toLowerCase();
  if (head === '/clear') return cmdClear();
  if (head === '/help' || head === '/?' || head === '/hilfe') return cmdHelp();
  let sub, args;
  if (head === '/buddy') { sub = (parts[1] || 'help').toLowerCase(); args = parts.slice(2); }
  else { sub = head.slice(1); args = parts.slice(1); }
  if (sub === '?') sub = 'help';
  const key = norm(sub);
  sub = ALIAS[key] || sub;
  const cmd = COMMANDS.find((c) => c.c === '/buddy ' + sub);
  if (!cmd) { out('Unbekannter Befehl: ' + raw.trim() + '. /buddy help zeigt alle.'); say('Mäh? Den Befehl kenn ich nicht.'); return; }
  cmd.run(args);
}

function handleMessage(text) {

  if (goat.off) { out(S.name + ' ist gerade nicht da.'); return; }
  if (act.type === 'hatch') { out(S.name + ' ist noch im Ei.'); return; }
  if (act.type === 'sleep') { setTimeout(() => { say('Zzz …'); out(S.name + ' schläft.'); }, 400); return; }
  const grounded = ['idle', 'walk', 'watch', 'lie', 'pet', 'bleat', 'graze', 'rise'].includes(act.type);
  const hungry = CFG.beduerfnisse && needs.food < 30;
  if (grounded && ((hungry && Math.random() < 0.7) || Math.random() < 0.05)) { eatMessage(line, text); return; }
  setTimeout(() => respond(text, 0), rand(350, 700));
}
function respond(text, tries) {
  if (goat.off || act.type === 'sleep' || act.type === 'hatch') return;
  if (busyAir() || act.type === 'nibble') {
    if (tries < 4) setTimeout(() => respond(text, tries + 1), 600);
    else goatLine('Mäh! Später, ich bin beschäftigt!');
    return;
  }
  const t = text.toLowerCase();
  const has = (re) => re.test(t);
  if (t.includes(S.name.toLowerCase())) { reply(pick(['Mäh? Du hast gerufen?', 'Ja, das bin ich!', 'Hier! Mäh!'])); hopInPlace(1); return; }
  if (has(/\b(hallo|hi|hey|hoi|hoii|gr[üu]e?zi|gruezi|servus|moin|salü|salu|salut|tschau|ciao|guten (morgen|tag|abend))\b/)) { reply(pick(['Mäh! Hoi!', 'Grüezi! Hast du Gras dabei?', 'Hallo! Schön, dass du da bist.'])); return; }
  if (has(/(gras|futter|hunger|essen|fressen|heu|salat|löwenzahn|snack)/)) { const full = CFG.beduerfnisse && needs.food > 85; reply(full ? 'Gras? Später. Ich bin voll.' : 'Hast du Gras gesagt?! Wo? GRAS?!'); if (!full) hopInPlace(1); return; }
  if (has(/(bug|fehler|error|exception|crash|kaputt|absturz)/)) { reply(pick(['Ein Käfer? Wo? *schnüffel*', 'Bugs sind Snacks mit Beinen.', 'Hast du es schon mit Aus- und Einschalten probiert? Oder mit Gras?'])); return; }
  if (has(/(test|tests|pipeline|build|\bci\b)/)) { reply(pick(['Grüner Build, grünes Gras. So ist das.', 'Laufen die Tests? Ich lauf lieber auf Felsen.'])); return; }
  if (has(/(deploy|release|push|merge|commit|prod)/)) { reply(pick(['Freitags deployen? Ich schau weg.', 'Mäh-rge-Konflikt? Den hab ich schon gefressen.', 'Force-Push? Mutig. Sehr ziegenhaft.'])); return; }
  if (has(/(böse|boese|doof|blöd|bloed|dumm|stinkt|hässlich|haesslich|nervig)/)) { startCharge('insult'); goatLine('MÄH! Nimm das zurück!'); return; }
  if (has(/(lieb|brav|gut gemacht|super|toll|süss|suess|schön|schoen|beste|cute|herzig|jööh|jöö)/)) {
    setAct('pet', { dur: 1.6, hT: 0, fi: 0, tick: 0.4 }); needs.mood = clamp(needs.mood + 8, 0, 100);
    reply(pick(['Mäh~ ♥', 'Ich weiss. Aber sag es ruhig nochmal.', 'Du bist auch ganz okay. Für einen Menschen.'])); return;
  }
  if (has(/(müde|muede|schlaf|gute nacht|nacht)/)) { reply('Gute Idee. Ich leg mich kurz hin.'); goLie(); return; }
  if (has(/(kaffee|coffee|espresso)/)) { reply('Kaffee? Ich nehm lieber Löwenzahntee.'); return; }
  if (has(/(schweiz|alp|berg|matterhorn|zürich|zuerich|bern|luzern|basel|chur)/)) { reply(pick(['Hopp Schwiiz! Mäh!', 'Ich komm von der Alp. Da ist das Gras grüner.'])); return; }
  if (has(/(tanz|dance|trick|spring|hüpf|huepf)/)) { goatLine('Schau her!'); cmdTrick(); return; }
  if (has(/(m[äa]+h|meh|b[äa]+h)/)) { doBleat('MÄÄÄH!'); goatLine('MÄÄÄH!'); return; }
  if (has(/schaf/)) { reply('Ich bin kein Schaf. Ich hab Bart UND Stil.'); return; }
  if (has(/(kuh|kühe|kuehe)/)) { reply('Kühe haben die grösseren Glocken. Ich hab den grösseren Charme.'); return; }
  if (has(/(katze|hund)/)) { reply('Ich bin das bessere Haustier. Ich esse sogar deinen Papierkram.'); return; }
  if (t.trim().endsWith('?')) { reply(pick(L.question)); return; }
  reply(pick(L.generic));
}

/* ================================================================ input + suggestions */
const form = $('#prompt'), input = $('#cmd'), sugEl = $('#suggest');
let sugItems = [], sel = 0;
const hist = [];
let hi = -1;
function closeSuggest() { sugEl.hidden = true; sugItems = []; input.removeAttribute('aria-activedescendant'); }
function renderSuggest() {
  sugEl.textContent = '';
  sugItems.forEach((c, i) => {
    const li = document.createElement('li');
    li.id = 'sg' + i;
    li.setAttribute('role', 'option');
    li.setAttribute('aria-selected', i === sel ? 'true' : 'false');
    const a = document.createElement('span'); a.className = 'c'; a.textContent = c.c + (c.args ? ' ' + c.args : '');
    const b = document.createElement('span'); b.className = 'd'; b.textContent = c.d;
    li.append(a, b);
    li.addEventListener('mousedown', (e) => { e.preventDefault(); sel = i; accept(true); });
    sugEl.appendChild(li);
  });
  sugEl.hidden = false;
  input.setAttribute('aria-activedescendant', 'sg' + sel);
  const cur = sugEl.children[sel];
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}
function updateSuggest() {
  const v = input.value.toLowerCase();
  if (!v.startsWith('/')) { closeSuggest(); return; }
  sugItems = COMMANDS.filter((c) => c.c.startsWith(v) || ('/' + c.c.split(' ').slice(1).join(' ')).startsWith(v));
  if (!sugItems.length || (sugItems.length === 1 && sugItems[0].c === v.trim() && !sugItems[0].args)) { closeSuggest(); return; }
  sel = clamp(sel, 0, sugItems.length - 1);
  renderSuggest();
}
function accept(run) {
  const it = sugItems[sel];
  if (!it) return;
  if (it.args) { input.value = it.c + ' '; closeSuggest(); input.focus(); return; }
  input.value = it.c;
  closeSuggest();
  if (run) submitValue();
}
function submitValue() {
  const v = input.value.trim();
  if (!v) return;
  input.value = '';
  closeSuggest();
  hist.push(v);
  if (hist.length > 50) hist.shift();
  hi = -1;
  audioWake();
  if (v.startsWith('/')) { logLine('user', v); runCommand(v); }
  else handleMessage(v);
}
form.addEventListener('submit', (e) => { e.preventDefault(); submitValue(); });
input.addEventListener('input', () => { sel = 0; updateSuggest(); if (input.value && !input.value.startsWith('/')) watchTyping(); });
input.addEventListener('blur', () => setTimeout(closeSuggest, 120));
input.addEventListener('keydown', (e) => {
  if (!sugEl.hidden && sugItems.length) {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % sugItems.length; renderSuggest(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + sugItems.length) % sugItems.length; renderSuggest(); return; }
    if (e.key === 'Tab') { e.preventDefault(); accept(false); return; }
    if (e.key === 'Enter') { e.preventDefault(); accept(true); return; }
    if (e.key === 'Escape') { e.preventDefault(); closeSuggest(); return; }
  }
  if (e.key === 'Escape') { e.preventDefault(); interrupt(); return; }
  if (e.key === 'ArrowUp' && hist.length) {
    e.preventDefault();
    hi = hi < 0 ? hist.length - 1 : Math.max(0, hi - 1);
    input.value = hist[hi];
    requestAnimationFrame(() => input.setSelectionRange(input.value.length, input.value.length));
  } else if (e.key === 'ArrowDown' && hi >= 0) {
    e.preventDefault();
    hi++;
    if (hi >= hist.length) { hi = -1; input.value = ''; } else input.value = hist[hi];
  }
});
function audioWake() { if (S.sound) audio(); }

/* ================================================================ pointer: pet, grab, plant */
function toArt(cx, cy) {
  const r = screenEl.getBoundingClientRect();
  const k = P / dpr;
  const canvasTop = r.bottom - AH * k;
  return [(cx - r.left) / k, (cy - canvasTop) / k];
}
function hitGoat(ax, ay) {
  if (goat.hidden) return false;
  const flip = goat.face < 0;
  const left = spriteLeft(), top = spriteTop();
  const b = META[goat.frame].box;
  const x0 = flip ? FW - 1 - b[2] : b[0], x1 = flip ? FW - 1 - b[0] : b[2];
  const pad = 2;
  return ax >= left + x0 - pad && ax <= left + x1 + 1 + pad && ay >= top + b[1] - pad - hatHeight() && ay <= top + b[3] + 1 + pad;
}
let press = null;
function onDown(e) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  audioWake();
  const [ax, ay] = toArt(e.clientX, e.clientY);
  const onGoat = e.currentTarget === handleEl || hitGoat(ax, ay);
  if (onGoat) {
    if (!CFG.streicheln && !CFG.hochheben) return;
    e.preventDefault();
    press = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false, trail: [], ox: ax - goat.x, oy: ay - (GY - goat.y) };
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  } else if (CFG.fuettern) {
    plantAt(ax);
  }
}
function onMove(e) {
  if (!press || e.pointerId !== press.id) return;
  const [ax, ay] = toArt(e.clientX, e.clientY);
  if (!press.drag && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5) {
    if (!CFG.hochheben || goat.off || act.type === 'hatch') return;
    press.drag = true;
    grab();
    handleEl.classList.add('dragging');
  }
  if (press.drag) {
    goat.x = clamp(ax - press.ox, 10, AW - 10);
    goat.y = clamp(GY - (ay - press.oy), 0, AH - FH - 2);
    press.trail.push({ x: goat.x, y: goat.y, t: performance.now() });
    if (press.trail.length > 6) press.trail.shift();
  }
}
function onUp(e) {
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  press = null;
  handleEl.classList.remove('dragging');
  if (p.drag) {
    let vx = 0, vy = 0;
    const tr = p.trail;
    if (tr.length > 1) {
      const a = tr[0], b = tr[tr.length - 1];
      const dt = (b.t - a.t) / 1000;
      if (dt > 0.008 && performance.now() - b.t < 120) { vx = (b.x - a.x) / dt; vy = (b.y - a.y) / dt; }
    }
    release(vx, vy);
  } else if (e.type === 'pointerup' && CFG.streicheln) {
    doPet(false);
  }
}
for (const el of [meadowEl, handleEl]) {
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}
function plantAt(ax) {
  let x = Math.round(clamp(ax, 6, AW - 6));
  if (!CFG.laufen && !goat.hidden) x = Math.round(clamp(mouthX(), 6, AW - 6));
  if (nearRock(x, 9)) { if (!goat.hidden) say('Auf dem Felsen wächst nichts.'); return; }
  const t = addTuft(x, 'grass', 1, true);
  sparkles(t.x, GY - 2, 3, 2);
  sfx('pop');
  setTimeout(() => {
    if (!world.tufts.includes(t) || goat.hidden) return;
    if (!['idle', 'walk', 'watch', 'lie'].includes(act.type) || (goat.onRock && Math.random() < 0.5)) return;
    if (CFG.beduerfnisse && needs.food > 92) { if (Math.random() < 0.5) say('Später. Ich bin pappsatt.'); return; }
    if (act.type === 'lie') setAct('rise', { dur: 0.18, then: () => goEat(t) });
    else goEat(t);
  }, 900);
}

/* ================================================================ chips + icons */
const ICONS = {
  heart: ['.xx.xx.', 'xxxxxxx', 'xxxxxxx', '.xxxxx.', '..xxx..', '...x...'],
  grass: ['.x...x.', '.x.x.x.', 'xx.x.xx', '.xxxxx.', 'xxxxxxx'],
  star: ['...x...', '..xxx..', 'xxxxxxx', '.xxxxx.', '.xx.xx.', 'x.....x'],
  speech: ['xxxxxxx', 'x.....x', 'x.x.x.x', 'x.....x', 'xxxxxxx', '.x.....', 'x......'],
  crown: ['x..x..x', 'xx.x.xx', 'xxxxxxx', 'xxxxxxx'],
  card: ['xxxxxxx', 'x.....x', 'x.xx..x', 'x.....x', 'x.xxx.x', 'xxxxxxx'],
  moon: ['.xxx...', 'xx.....', 'x......', 'x......', 'xx.....', '.xxx...'],
  sound: ['..x..x.', '.xx...x', 'xxx.x.x', 'xxx.x.x', '.xx...x', '..x..x.'],
  soundOff: ['..x....', '.xx.x.x', 'xxx..x.', 'xxx.x.x', '.xx....', '..x....'],
};
function iconSvg(name) {
  const g = ICONS[name];
  const w = g[0].length, h = g.length;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.setAttribute('width', w * 2);
  svg.setAttribute('height', h * 2);
  svg.setAttribute('shape-rendering', 'crispEdges');
  svg.setAttribute('aria-hidden', 'true');
  g.forEach((row, j) => {
    for (let i = 0; i < w; i++) {
      if (row[i] !== 'x') continue;
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', i); r.setAttribute('y', j); r.setAttribute('width', 1); r.setAttribute('height', 1);
      r.setAttribute('fill', 'currentColor');
      svg.appendChild(r);
    }
  });
  return svg;
}
document.querySelectorAll('.chip').forEach((b) => {
  b.prepend(iconSvg(b.dataset.icon));
  b.addEventListener('click', () => {
    audioWake();
    const c = b.dataset.cmd;
    logLine('user', c);
    runCommand(c);
  });
});
document.querySelectorAll('.seg button').forEach((b) => {
  b.addEventListener('click', () => {
    const v = +b.dataset.size;
    if (v !== S.size) { setSize(v); out('Grösse: ' + b.textContent + '.'); }
  });
});

/* ================================================================ boot */
if (!SIMPLE) {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Pixelify+Sans:wght@500;600&display=swap';
  document.head.appendChild(link);
} else {
  srEl.removeAttribute('aria-live');
}
meadowEl.classList.toggle('nofeed', !CFG.fuettern);
handleEl.classList.toggle('pet-only', !CFG.hochheben);
readTheme();
updateNameUI();
updateToggles();
layout();
goat.x = Math.round(AW * startFrac());
if (CFG.gras) {
  addTuft(Math.round(AW * 0.12), 'grass', 3, false);
  const fx = Math.round(AW * 0.62);
  if (!nearRock(fx, 13)) addTuft(fx, 'flower', 3, false);
}
if (!returning && CFG.ei) {
  startHatch();
} else if (returning && !SIMPLE) {
  sys('✻ ' + S.name + ' ist wieder da.');
  out('Satt ' + Math.round(needs.food) + ' % · Laune ' + Math.round(needs.mood) + ' % · Energie ' + Math.round(needs.energy) + ' %');
  if (CFG.laufen) {
    goat.x = 4;
    walkTo(AW * startFrac(), { verb: 'home', speed: 15, then: () => say('Mäh! Da bist du ja wieder.') });
  } else setIdle(rand(1, 3));
} else {
  setIdle(rand(1, 3));
}
save();

if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(screenEl);
window.addEventListener('resize', layout);
const themeChanged = () => { readTheme(); drawBackground(); };
if (window.matchMedia) {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', themeChanged);
}
new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
window.addEventListener('pagehide', save);

let last = performance.now(), raf = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  time += dt;
  act.t += dt;
  step(dt);
  render();
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); save(); }
  else { last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
});
raf = requestAnimationFrame(frame);
})();
</script>
